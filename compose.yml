name: cleanmate-agent

services:
  api:
    build: .
    env_file:
      - path: .env
        format: raw
    environment:
      CHROMA_PERSIST_DIRECTORY: /app/storage/chroma_db
      CHROMA_MD5_HEX_STORE: /app/storage/md5.text
      CHROMA_DATA_PATH: /app/data
    volumes:
      - agent_storage:/app/storage
      - agent_logs:/app/logs
      - ./data:/app/data:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      start_period: 60s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 6s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  agent_storage:
  agent_logs:
